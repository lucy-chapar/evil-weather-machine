; Weather display firmware for the Digital Sand toy (ESP32 DevKit V1 + 8x8 WS2812B).
; Build and flash over USB with:   pio run -t upload
; Update over WiFi with:           pio run -e ota -t upload

[platformio]
default_envs = esp32dev
; The OTA password lives in ota_password.ini, which is not committed.
; Copy ota_password.example.ini to ota_password.ini and set your own.
extra_configs = ota_password.ini

[env:esp32dev]
platform = espressif32@6.4.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit NeoPixel@^1.12.3
    bblanchon/ArduinoJson@^7.2.0
    tzapu/WiFiManager@^2.0.17
build_flags = -DOTA_PASSWORD=\"${ota.password}\"

; Same firmware, uploaded over WiFi to digitalsand.local.
[env:ota]
extends = env:esp32dev
upload_protocol = espota
upload_port = digitalsand.local
upload_flags = --auth=${ota.password}

; Plays every screen back to back without WiFi:  pio run -e demo -t upload
[env:demo]
extends = env:esp32dev
build_flags = ${env:esp32dev.build_flags} -DDEMO_MODE
